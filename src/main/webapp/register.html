<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkHive - Register</title>
    <style>
        /* Base Styling - Matching the login dark theme */
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Navbar Styling */
        .navbar {
            background-color: #12161d;
            padding: 0.8rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d333b;
        }
        .nav-left { display: flex; gap: 25px; align-items: center; }
        .nav-brand { font-size: 1.4rem; font-weight: 700; color: #f0f6fc; text-decoration: none; letter-spacing: -0.5px; }
        .nav-link { color: #8b949e; text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
        .nav-link:hover { color: #ffffff; }

        .nav-right { display: flex; gap: 15px; }
        .btn-signin { color: #8b949e; text-decoration: none; border: 1px solid #30363d; padding: 6px 16px; border-radius: 6px; font-size: 0.9rem; }
        .btn-register { background-color: #1f6feb; color: white; text-decoration: none; padding: 6px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; }

        /* Main Content & Card */
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; }
        
        .auth-card {
            background-color: #151b23;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .auth-card h2 { margin: 0 0 0.5rem 0; font-size: 1.8rem; }
        .auth-card p { color: #8b949e; font-size: 0.9rem; margin-bottom: 1.5rem; }

        /* Form Elements */
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 8px; color: #8b949e; font-size: 0.85rem; }
        input, select {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus, select:focus { border-color: #58a6ff; outline: none; box-shadow: 0 0 0 3px rgba(88,166,255,0.1); }

        /* Success Green for Register Button */
        .btn-submit {
            background-color: #238636;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 120px;
            font-size: 1rem;
        }
        .btn-submit:hover { background-color: #2ea043; }

        /* Footer Link Placement */
        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
        }
        .login-link { font-size: 0.9rem; color: #8b949e; text-decoration: none; }
        .login-link span { color: #58a6ff; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="nav-brand">WorkHive</a>
            <a href="#" class="nav-link">Jobs</a>
            <a href="#" class="nav-link">Companies</a>
        </div>
        <div class="nav-right">
            <a href="login.html" class="btn-signin">Sign in</a>
            <a href="register.html" class="btn-register">Register</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="auth-card">
            <h2>Create your account</h2>
            <p>Join the WorkHive community to unlock your career potential.</p>
            
            <form action="register" method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="name@example.com">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label>Registration Type</label>
                    <select name="role" required>
                        <option value="SEEKER">Job Seeker</option>
                        <option value="RECRUITER">Recruiter</option>
                    </select>
                </div>
                
                <div class="form-footer">
                    <button type="submit" class="btn-submit">Register</button>
                    <a href="login.html" class="login-link">Already have an account? <span>Sign in</span></a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
